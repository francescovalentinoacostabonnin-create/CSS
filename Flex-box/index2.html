
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flex-Box2</title>
    <style>
      
body {
    background-color: #f3caca;
    font-family: Arial, sans-serif;
}

.contenedor {
    display: flex;
    background-color: white;
    width: 350px;
    height: 300px;
    padding: 3px;
    margin: 20px auto;
    gap: 5px;
}

.caja {
    background-color: lightblue;
    padding: 20px;
    height: fit-content;
    text-align: center;
}

    </style>
</head>
<body>
    <main class="contenedor">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
    </main>
</body>
</html>
