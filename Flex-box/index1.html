<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box1</title>
    <style>
        .cuadrado {
            width: 100px;
            height: 100px;
            background-color: red;
        }

        .contenedor {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
        }
    </style>
</head>
<body>
    <main class="contenedor">
        <div class="cuadrado"></div>
    </main>
</body>
</html>
